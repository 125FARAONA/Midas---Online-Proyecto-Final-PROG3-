<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midas Online — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-poppins flex items-center justify-center min-h-screen transition-colors duration-500">
<div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md glass">
  <img src="images/logo.svg" class="w-20 h-20 mx-auto mb-4 logo-3d" alt="Midas logo">
  <h1 class="text-2xl font-bold text-center mb-6">Midas Online</h1>
  <form id="loginForm" class="space-y-4">
    <input type="email" id="email" placeholder="Correo electrónico" class="input">
    <input type="password" id="password" placeholder="Contraseña" class="input">
    <p id="errorMsg" class="text-red-500 text-sm min-h-[1.25rem]"></p>
    <button type="submit" class="btn-primary w-full">Iniciar Sesión</button>
  </form>
  <div class="flex items-center justify-between mt-4 text-sm">
    <button id="forgotPassword" class="link">Olvidé mi contraseña</button>
    <button id="themeToggle" class="btn-secondary">Modo Claro/Oscuro</button>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
