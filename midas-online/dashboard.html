<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midas Online — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500">
<header class="w-full px-6 py-4 flex items-center justify-between bg-white/70 dark:bg-gray-800/70 backdrop-blur-md shadow">
  <div class="flex items-center gap-3">
    <img src="images/logo.svg" class="w-9 h-9 logo-3d" alt="Midas logo">
    <div class="leading-tight">
      <div class="font-semibold">Midas Online</div>
      <div id="welcomeName" class="text-xs opacity-80"></div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <button id="themeToggle" class="btn-secondary">Modo Claro/Oscuro</button>
    <button id="logoutBtn" class="btn-danger">Cerrar sesión</button>
  </div>
</header>

<main class="container mx-auto px-6 py-6 grid lg:grid-cols-4 gap-6">
  <aside class="lg:col-span-1">
    <nav class="card3d p-4 sticky top-6">
      <ul class="space-y-2">
        <li><button class="nav-link active" data-section="overview">Resumen</button></li>
        <li><button class="nav-link" data-section="transactions">Transacciones</button></li>
        <li><button class="nav-link" data-section="insights">Insights</button></li>
      </ul>
    </nav>
  </aside>

  <section class="lg:col-span-3 space-y-6">
    <div id="section-overview" class="section card3d p-6">
      <h2 class="text-xl font-bold mb-4">Saldo y cuentas</h2>
      <div class="grid md:grid-cols-3 gap-4">
        <div class="account-card">
          <div class="text-sm opacity-70">Cuenta Corriente</div>
          <div id="balance" class="text-2xl font-extrabold text-midas mt-1">$0</div>
          <div class="text-xs opacity-70 mt-2" id="acctNumber">•••• 0000</div>
        </div>
        <div class="account-card">
          <div class="text-sm opacity-70">Tarjeta Crédito</div>
          <div id="ccLimit" class="text-2xl font-extrabold mt-1">$0</div>
          <div class="text-xs opacity-70 mt-2">Límite disponible</div>
        </div>
        <div class="account-card">
          <div class="text-sm opacity-70">Ahorros</div>
          <div id="savings" class="text-2xl font-extrabold mt-1">$0</div>
          <div class="text-xs opacity-70 mt-2">Meta mensual</div>
        </div>
      </div>
      <div class="flex flex-wrap gap-3 mt-5">
        <button class="btn-primary" data-action="deposit">Depositar</button>
        <button class="btn-primary" data-action="transfer">Transferir</button>
        <button class="btn-primary" data-action="pay">Pagar</button>
      </div>
    </div>

    <div id="section-transactions" class="section card3d p-6 hidden">
      <h2 class="text-xl font-bold mb-4">Últimas transacciones</h2>
      <ul id="transactionsList" class="space-y-2"></ul>
    </div>

    <div id="section-insights" class="section card3d p-6 hidden">
      <h2 class="text-xl font-bold mb-4">Gastos por categoría</h2>
      <canvas id="expenseChart" height="140"></canvas>
    </div>
  </section>
</main>

<script src="js/main.js"></script>
<script src="js/chart.js"></script>
</body>
</html>
